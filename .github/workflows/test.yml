name: WORKVERSE tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workverse/server/package-lock.json
      - run: npm ci --prefix workverse/server --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix workverse/server
